services:
  postgres:
    image: postgres:16
    container_name: inventory_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory_dev}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
      TZ: America/Lima
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - inventory_pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=32MB
      -c maintenance_work_mem=128MB
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventory} -d ${POSTGRES_DB:-inventory}"]
      interval: 5s
      timeout: 5s
      retries: 12

  metabase:
    image: metabase/metabase:latest
    container_name: inventory_metabase
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${METABASE_PORT:-3001}:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_JETTY_PORT: 3000
      JAVA_TIMEZONE: America/Lima
      JAVA_OPTS: "-Xmx1g"
    volumes:
      - inventory_metabase_data:/metabase-data

volumes:
  inventory_pgdata:
  inventory_metabase_data:
